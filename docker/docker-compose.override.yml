# =============================================================================
#  docker-compose.override.yml · Aegir Hotel — GPU passthrough (opt-in)
# -----------------------------------------------------------------------------
#  Docker Compose merges this file on top of docker-compose.yml automatically
#  whenever you run a bare `docker compose ...` command. It adds NVIDIA GPU
#  access to the `website` container — useful later for hardware-accelerated
#  react-three-fiber / WebGL work and headless Blender renders.
#
#  ┌─ Machine WITH an NVIDIA GPU + NVIDIA Container Toolkit ────────────────────
#  │   docker compose up                     → base + this override (GPU on)
#  │
#  └─ Machine WITHOUT GPU support ────────────────────────────────────────────
#      docker compose -f docker-compose.yml up   → base only, this file ignored
#      (or just delete / rename this file)
#
#  Requirements for the GPU path:
#    · NVIDIA driver on the host
#    · NVIDIA Container Toolkit  (https://docs.nvidia.com/datacenter/cloud-native)
#    · Docker Desktop: Settings → Resources → enable GPU (WSL2 backend)
#
#  Verify inside the container:  nvidia-smi
# =============================================================================

services:

  website:
    environment:
      # Expose every GPU and every driver capability to the container.
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    # Modern Compose GPU reservation (Compose Spec / `deploy.resources`).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Uncomment to also give the test container a GPU (e.g. r3f snapshot tests).

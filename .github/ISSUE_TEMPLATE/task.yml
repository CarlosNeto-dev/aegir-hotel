name: 🧩 Task / Tarefa (GitHub Projects)
description: A concrete unit of work tracked on the board. / Unidade concreta de trabalho no quadro.
title: "FRENTE 00 - "
labels: ["task"]
projects: ["CarlosNeto-dev/3"]
body:
  - type: markdown
    attributes:
      value: |
        **Título:** `FRENTE NÚMERO - TEMA`, por exemplo `FRONT 01 - Finalizar o header`.
        Issue mãe com dois dígitos (`FRONT 01`), sub-issue com ponto (`FRONT 01.1`).
        Se esta tarefa depende de outra, marque em **Relationships → Blocked by** depois de criar.

  - type: dropdown
    id: frente
    attributes:
      label: Frente
      options:
        - INFRA
        - DOCS
        - FRONT
        - 3D
    validations:
      required: true

  - type: textarea
    id: descricao
    attributes:
      label: Descrição
      description: O que deve ser feito, em texto corrido.
    validations:
      required: true

  - type: input
    id: requisitos
    attributes:
      label: Requisitos
      description: Os requisitos que esta tarefa atende, se houver.
      placeholder: RF-005, RF-006

  - type: input
    id: versao
    attributes:
      label: Versão alvo
      placeholder: v0.2.0